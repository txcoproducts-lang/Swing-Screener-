name: Nightly screener

on:
  schedule:
    # 22:15 UTC Mon-Fri = 5:15 PM Central in summer, 4:15 PM Central in winter
    - cron: "15 22 * * 1-5"
  workflow_dispatch:         # lets you run it any time from the Actions tab
    inputs:
      refresh:
        description: "Refresh only: republish the page with the latest prices, save nothing to history/"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read              # to fetch the crypto page's files from the last crypto run

concurrency:
  # Refreshes (started by the Refresh loop workflow) queue in their own group, so a refresh waiting its turn can
  # never bump the nightly run (GitHub keeps only the newest waiting run in a group).
  group: ${{ inputs.refresh && 'refresh' || 'screener' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run screener
        run: python screener.py --out output

      - name: Build site
        run: |
          mkdir -p site
          cp output/latest.html site/index.html
          cp output/*.csv site/
          cp -r output/data site/ 2>/dev/null || true
          cp -r output/ovtlyr site/ 2>/dev/null || true    # the OVTLYR screener page

      - name: Add the crypto page from the last crypto run (crypto/, best effort)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow crypto-nightly.yml --status success --limit 1 --json databaseId -q '.[0].databaseId' || true)
          [ -n "$run" ] && gh run download "$run" -R "$GITHUB_REPOSITORY" -n crypto-site -D site/crypto || echo "No crypto page files found; publishing the stock page alone."

      - name: Save daily CSVs to history
        # only the 22:15 run and runs started by hand; refreshes (Refresh loop workflow) just republish the page
        if: ${{ !inputs.refresh }}
        run: |
          mkdir -p history
          cp output/*.csv history/
          [ -f output/ai_picks.json ] && cp output/ai_picks.json history/ || true    # the AI picks list carries over to the next night
          cp output/ovtlyr_*.json history/ 2>/dev/null || true    # the OVTLYR plan, traded by paper.py the next morning
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add history
          git commit -m "Screener results $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase origin main
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 7    # the crypto workflow republishes this with the crypto page, weekends too
      - id: deploy
        uses: actions/deploy-pages@v4
