name: Nightly screener

on:
  schedule:
    # 22:15 UTC Mon-Fri = 5:15 PM Central in summer, 4:15 PM Central in winter
    - cron: "15 22 * * 1-5"
  workflow_dispatch: {}      # lets you run it any time from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run screener
        run: python screener.py --out output

      - name: Build site
        run: |
          mkdir -p site
          cp output/latest.html site/index.html
          cp output/*.csv site/

      - name: Save daily CSVs to history
        run: |
          mkdir -p history
          cp output/*.csv history/
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add history
          git commit -m "Screener results $(date -u +%F)" || echo "nothing to commit"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
