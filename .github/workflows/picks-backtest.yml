name: Pick lists backtest

on:
  workflow_dispatch: {}      # run from the Actions tab; takes about 15 minutes
  push:
    branches: [picks-research]

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Backtest the pick lists on 12 years of data
        run: python research/picks_backtest.py --out picks_results

      - name: Show the results on the run page
        run: cat picks_results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save the results to the picks-backtest branch
        run: |
          cd picks_results
          git init -q -b picks-backtest
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add . && git commit -qm "Pick lists backtest $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" picks-backtest
