name: Open rundown

# The Open page at .../Swing-Screener-/open/: a rundown right after the market opens (open_page.py), once a day at about
# 9:35 AM New York (8:35 AM Central), on top of the after-close nightly run.
#
# GitHub's own schedules fire only a few times a day on this repo, hours late, so this workflow keeps its own clock:
# a run waits (up to ~5 hours at a time, then starts the next run of itself) until 9:35 AM New York on the next weekday,
# builds and publishes the page, then starts the next run, which waits for the next morning. The schedule below only
# restarts the chain if it ever breaks; only one run is active at a time. A run started by hand from the Actions tab
# (leave "wait" unticked) builds the page right away; on a day with no trading yet it publishes the newest Open page again.
# To stop it: Actions tab -> Open rundown -> "..." -> Disable workflow, and cancel the waiting run.

on:
  workflow_dispatch:
    inputs:
      wait:
        description: "Wait for 9:35 AM New York first (the chain uses this)"
        type: boolean
        default: false
      preview:
        description: "On a day with no trading: build a preview from the last trading day instead of republishing the last Open page"
        type: boolean
        default: false
  schedule:
    - cron: "0 9 * * 1-5"      # backup starter only

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write               # to fetch the other pages' files and start the next run

concurrency:
  group: open-rundown-${{ (github.event_name == 'workflow_dispatch' && !inputs.wait) && 'by-hand' || 'chain' }}   # a hand run doesn't queue behind the waiting one
  cancel-in-progress: false

jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    outputs:
      go: ${{ steps.clock.outputs.go }}
    steps:
      - name: Wait for 9:35 AM New York
        id: clock
        env:
          WAIT: ${{ github.event_name == 'schedule' || inputs.wait }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$WAIT" != "true" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          # seconds until the next weekday 9:35 AM New York; only the backup schedule goes right away if it starts 9:35-9:38
          # (a run the chain starts right after building waits for the next day, so the page isn't built twice)
          secs=$(python3 -c '
          import datetime as d, os, zoneinfo
          ny = zoneinfo.ZoneInfo("America/New_York"); now = d.datetime.now(ny)
          t = now.replace(hour=9, minute=35, second=0, microsecond=0)
          if os.environ["EVENT"] == "schedule" and now.weekday() < 5 and t <= now < t + d.timedelta(minutes=3): print(0); raise SystemExit
          t = t if now < t else t + d.timedelta(days=1)
          while t.weekday() >= 5: t += d.timedelta(days=1)
          print(int((t.astimezone(d.timezone.utc) - now.astimezone(d.timezone.utc)).total_seconds()))')
          echo "next open run in $secs seconds"
          if [ "$secs" -gt 19800 ]; then          # more than 5.5 hours: wait part of it, then hand over to a new run
            sleep $(( secs - 3600 < 18900 ? secs - 3600 : 18900 ))
            gh workflow run open.yml -R "$GITHUB_REPOSITORY" -f wait=true
            echo "go=0" >> "$GITHUB_OUTPUT"
          else
            sleep "$secs"
            echo "go=1" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: wait
    if: needs.wait.outputs.go == '1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build the Open page
        env:
          GH_TOKEN: ${{ github.token }}
          BY_HAND: ${{ github.event_name == 'workflow_dispatch' && !inputs.wait }}
          PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.preview }}
        run: |
          python open_page.py --out open-out
          # started by hand on a day with no trading yet: publish the newest Open page again (the site needs it back after a
          # deploy that left it out); with none saved, build a preview from the last trading day
          if [ "$PREVIEW" = "true" ] && [ ! -f open-out/open/index.html ]; then
            python open_page.py --out open-out --any-day
          elif [ "$BY_HAND" = "true" ] && [ ! -f open-out/open/index.html ]; then
            for r in $(gh run list -R "$GITHUB_REPOSITORY" --workflow open.yml --status success --limit 20 --json databaseId -q '.[].databaseId'); do
              gh run download "$r" -R "$GITHUB_REPOSITORY" -n open-site -D open-out/open 2>/dev/null && { echo "Republishing the Open page from run $r"; break; }
            done
            [ -f open-out/open/index.html ] || python open_page.py --out open-out --any-day
          fi

      - name: Add the other pages (stocks + OVTLYR from the last nightly run, crypto from the last crypto run)
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f open-out/open/index.html ] || { echo "No Open page today (no trading yet); nothing to publish."; exit 0; }
          R="$GITHUB_REPOSITORY"
          run=$(gh run list -R "$R" --workflow nightly.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')
          mkdir -p stock site
          if [ -n "$run" ] && gh run download "$run" -R "$R" -n github-pages -D stock && [ -f stock/artifact.tar ]; then
            tar -xf stock/artifact.tar -C site
          else
            echo "::warning::The stock page's files weren't found, so this run doesn't publish (that would take the stock page down)."
            exit 0
          fi
          crun=$(gh run list -R "$R" --workflow crypto-nightly.yml --status success --limit 1 --json databaseId -q '.[0].databaseId' || true)
          [ -n "$crun" ] && rm -rf crypto-new && gh run download "$crun" -R "$R" -n crypto-site -D crypto-new && rm -rf site/crypto && mv crypto-new site/crypto || echo "Keeping the crypto page from the nightly run."
          rm -rf site/open && cp -r open-out/open site/open
          echo "ok=1" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.site.outputs.ok
        with:
          name: open-site
          path: open-out/open
          retention-days: 7
      - uses: actions/configure-pages@v5
        if: steps.site.outputs.ok
      - uses: actions/upload-pages-artifact@v3
        if: steps.site.outputs.ok
        with:
          path: site
          retention-days: 7
      - id: deploy
        if: steps.site.outputs.ok
        uses: actions/deploy-pages@v4

      - name: Start the wait for the next open
        if: always() && (github.event_name == 'schedule' || inputs.wait)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run open.yml -R "$GITHUB_REPOSITORY" -f wait=true
