name: Crypto page check

on:
  workflow_dispatch: {}      # run from the Actions tab to screenshot the live crypto page

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          cd .github/page-check
          npm init -y >/dev/null
          npm install playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Open the live crypto page and take screenshots
        env:
          PAGE_URL: https://txcoproducts-lang.github.io/Swing-Screener-/crypto/
        run: cd .github/page-check && node check.mjs
      - name: Save screenshots to the crypto-page-check branch
        if: always()
        run: |
          cd .github/page-check/shots
          git init -q -b crypto-page-check
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add . && git commit -qm "Crypto page check $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" crypto-page-check
