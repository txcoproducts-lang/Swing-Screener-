name: System diagnosis

# One-off research run (2026-10-20): breaks down why Your system and after 2 PM lag SPY and saves both sets
# of numbers on this test branch only. Nothing on main, the page or the paper accounts changes.
on:
  push:
    branches: [claude/two-day-confirm-test-92dj5c]
    paths: [research/system_diag.py, .github/workflows/system-diag.yml]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Diagnose
        run: python research/system_diag.py --out research/system_diag.json

      - name: Save the results on this branch
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add research/system_diag.json
          git commit -qm "System diagnosis results $(date -u +%F)" || exit 0
          for i in 1 2 3 4; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 10))
          done
          exit 1
