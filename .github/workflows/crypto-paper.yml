name: Crypto paper trading

on:
  schedule:
    # Every 30 minutes, every day (coins trade on weekends), 13:05-21:35 UTC. crypto/paper.py keeps the stock accounts'
    # New York clock: sells and buys at the first run after 10:00 (the after-2 PM account buys at the first run after
    # 3:00 instead), checks stops until 5:45 PM (the OVTLYR account decides its closing-price exits at the first run
    # after 3:30), and records the day's value at the first run after 4 PM.
    - cron: "5,35 13-21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print what it would do and save nothing"
        type: boolean
        default: true
      at:
        description: "Pretend it's this New York time, e.g. 2026-10-13 10:05 (blank = now)"
        required: false
        default: ""
      start:
        description: "Dry runs: pretend the trial starts on this date"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: crypto-paper
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Trading hours only
        id: gate
        run: |
          now=$(TZ=America/New_York date +%H%M)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$now" -ge 0940 ] && [ "$now" -le 1745 ]; }; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "It's $now in New York, outside 9:40 AM-5:45 PM, so there's nothing to do."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go

      - name: Check out the accounts (crypto-paper branch)
        if: steps.gate.outputs.go
        uses: actions/checkout@v4
        with:
          ref: crypto-paper
          path: paper-state
          fetch-depth: 2          # the amend below needs the parent commit

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.gate.outputs.go
        run: pip install -r requirements.txt

      - name: Trade
        id: trade
        if: steps.gate.outputs.go
        env:
          AT: ${{ inputs.at }}
          START: ${{ inputs.start }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python crypto/paper.py --state paper-state/paper --message "$RUNNER_TEMP/msg.txt" $DRY ${AT:+--at "$AT"} ${START:+--start "$START"}

      - name: Save the accounts
        if: always() && steps.gate.outputs.go && !inputs.dry_run && steps.trade.outcome != 'skipped'
        run: |
          cd paper-state
          git config user.name "paper-trading-bot"
          git config user.email "paper-trading-bot@users.noreply.github.com"
          mkdir -p paper && git add paper
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          old=$(git rev-parse HEAD)
          if [ -s "$RUNNER_TEMP/msg.txt" ]; then
            git commit -q -F "$RUNNER_TEMP/msg.txt"
            git push origin HEAD:crypto-paper
          elif [ "$(git log -1 --format=%s)" = "Prices updated" ]; then
            git commit -q --amend -m "Prices updated"
            git push --force-with-lease=crypto-paper:$old origin HEAD:crypto-paper
          else
            git commit -q -m "Prices updated"
            git push origin HEAD:crypto-paper
          fi
