name: Order block backtest

on:
  workflow_dispatch:         # run from the Actions tab; takes about 10 minutes
    inputs:
      stocks:
        description: "How many stocks to test"
        default: "1000"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Backtest order blocks on 10 years of data
        env:
          STOCKS: ${{ inputs.stocks || '1000' }}
        run: python research/ob_backtest.py --stocks "$STOCKS" --out ob_results

      - name: Show the results on the run page
        run: cat ob_results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save the results to the ob-backtest branch
        run: |
          cd ob_results
          git init -q -b ob-backtest
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add . && git commit -qm "Order block backtest $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ob-backtest
